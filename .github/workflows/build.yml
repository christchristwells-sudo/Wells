name: Construire APK

on:
workflow_dispatch:
inputs:
app_name:
description: "Nom de l'application"
required: true
default: "WELLS PAD"
type: string
app_url:
description: "Adresse du site"
required: true
default: "https://beautiful-chaja-6e1546.netlify.app"
type: string
package_id:
description: "Identifiant unique de l'application"
required: true
default: "com.wells.pad"
type: string

jobs:
build:
runs-on: ubuntu-24.04
timeout-minutes: 30

steps:
  - name: Recuperer le code
    uses: actions/checkout@v4

  - name: Installer Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: "17"

  - name: Installer Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: "8.7"

  - name: Construire le projet Android
    env:
      APP_NAME: ${{ inputs.app_name }}
      APP_URL: ${{ inputs.app_url }}
      APP_ID: ${{ inputs.package_id }}
    run: |
      mkdir -p app/src/main/java/com/webwrap/app
      mkdir -p app/src/main/res/values

      cat > settings.gradle <<'EOF'
      pluginManagement {
          repositories {
              google()
              mavenCentral()
              gradlePluginPortal()
          }
      }
      dependencyResolutionManagement {
          repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
          repositories {
              google()
              mavenCentral()
          }
      }
      rootProject.name = "WebWrap"
      include ':app'
      EOF

      cat > build.gradle <<'EOF'
      plugins {
          id 'com.android.application' version '8.5.0' apply false
      }
      EOF

      cat > gradle.properties <<'EOF'
      org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
      android.useAndroidX=true
      EOF

      cat > app/build.gradle <<'EOF'
      plugins {
          id 'com.android.application'
      }

      android {
          namespace 'com.webwrap.app'
          compileSdk 34

          defaultConfig {
              applicationId 'com.wells.pad'
              minSdk 24
              targetSdk 34
              versionCode 1
              versionName '1.0'
          }

          compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
          }
      }
      EOF

      python3 - <<'PY'
      import os
      import re
      import xml.sax.saxutils

      name = xml.sax.saxutils.escape(os.environ["APP_NAME"])
      url = xml.sax.saxutils.escape(os.environ["APP_URL"])
      package_id = os.environ["APP_ID"]

      if not url.startswith("https://"):
          raise ValueError("L'adresse doit commencer par https://")

      if not re.fullmatch(r"[a-zA-Z][a-zA-Z0-9_]*(\.[a-zA-Z][a-zA-Z0-9_]*)+", package_id):
          raise ValueError("Identifiant d'application invalide")

      path = "app/build.gradle"
      with open(path, "r", encoding="utf-8") as f:
          gradle = f.read()

      gradle = gradle.replace(
          "applicationId 'com.wells.pad'",
          "applicationId '" + package_id + "'"
      )

      with open(path, "w", encoding="utf-8") as f:
          f.write(gradle)

      with open("app/src/main/res/values/strings.xml", "w", encoding="utf-8") as f:
          f.write(
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<resources>\n'
              f'  <string name="app_name">{name}</string>\n'
              f'  <string name="app_url">{url}</string>\n'
              '</resources>\n'
          )
      PY

      cat > app/src/main/res/values/styles.xml <<'EOF'
      <resources>
          <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
              <item name="android:statusBarColor">#0D0E10</item>
              <item name="android:navigationBarColor">#0D0E10</item>
          </style>
      </resources>
      EOF

      cat > app/src/main/AndroidManifest.xml <<'EOF'
      <?xml version="1.0" encoding="utf-8"?>
      <manifest xmlns:android="http://schemas.android.com/apk/res/android">
          <uses-permission android:name="android.permission.INTERNET" />

          <application
              android:label="@string/app_name"
              android:theme="@style/AppTheme"
              android:usesCleartextTraffic="false">

              <activity
                  android:name=".MainActivity"
                  android:exported="true"
                  android:configChanges="orientation|screenSize|keyboardHidden|screenLayout|smallestScreenSize">

                  <intent-filter>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent-filter>
              </activity>
          </application>
      </manifest>
      EOF

      cat > app/src/main/java/com/webwrap/app/MainActivity.java <<'EOF'
      package com.webwrap.app;

      import android.app.Activity;
      import android.content.Intent;
      import android.net.Uri;
      import android.os.Bundle;
      import android.webkit.WebChromeClient;
      import android.webkit.WebResourceRequest;
      import android.webkit.WebSettings;
      import android.webkit.WebView;
      import android.webkit.WebViewClient;

      public class MainActivity extends Activity {
          private WebView web;

          @Override
          protected void onCreate(Bundle state) {
              super.onCreate(state);

              web = new WebView(this);
              setContentView(web);

              WebSettings settings = web.getSettings();
              settings.setJavaScriptEnabled(true);
              settings.setDomStorageEnabled(true);
              settings.setMediaPlaybackRequiresUserGesture(false);

              final String home = getString(R.string.app_url);
              final String homeHost = Uri.parse(home).getHost();

              web.setWebViewClient(new WebViewClient() {
                  @Override
                  public boolean shouldOverrideUrlLoading(
                          WebView view, WebResourceRequest request) {
                      Uri uri = request.getUrl();

                      if (uri.getHost() != null &&
                              uri.getHost().equalsIgnoreCase(homeHost)) {
                          return false;
                      }

                      try {
                          startActivity(new Intent(Intent.ACTION_VIEW, uri));
                      } catch (Exception ignored) {
                      }

                      return true;
                  }
              });

              web.setWebChromeClient(new WebChromeClient());

              if (state == null) {
                  web.loadUrl(home);
              } else {
                  web.restoreState(state);
              }
          }

          @Override
          protected void onSaveInstanceState(Bundle outState) {
              super.onSaveInstanceState(outState);
              if (web != null) {
                  web.saveState(outState);
              }
          }

          @Override
          public void onBackPressed() {
              if (web != null && web.canGoBack()) {
                  web.goBack();
              } else {
                  super.onBackPressed();
              }
          }
      }
      EOF

  - name: Construire l'APK
    run: gradle --no-daemon assembleDebug

  - name: Preparer le fichier APK
    run: |
      mkdir -p sortie
      cp app/build/outputs/apk/debug/app-debug.apk sortie/WELLS-PAD.apk

  - name: Publier l'APK
    uses: actions/upload-artifact@v4
    with:
      name: WELLS-PAD-APK
      path: sortie/WELLS-PAD.apk
      if-no-files-found: error
      retention-days: 14
